# HTTPS proxy for sandpack-bundler on port 8443.
# Uses Let's Encrypt cert for cowork.schumann.se (trusted by all browsers).
# Serves patched preview-protocol.js that trusts private-network origins.
# sandbox-startup.js in the bundler container is volume-mounted to point
# preview-protocol.js fetches here instead of codesandbox.io.

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/cowork.schumann.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cowork.schumann.se/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve patched preview-protocol.js (trusts private-network origins)
    location = /p/preview-protocol.js {
        alias /etc/nginx/csb-static/preview-protocol.js;
        add_header Content-Type application/javascript;
        add_header Access-Control-Allow-Origin *;
    }

    location = /p/chrome-devtool/protocol/index.js {
        alias /etc/nginx/csb-static/chrome-devtool-protocol.js;
        add_header Content-Type application/javascript;
        add_header Access-Control-Allow-Origin *;
    }

    # Fix wrong content-type for service worker script
    location = /csb-sw.js {
        proxy_pass http://sandpack-bundler:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Type;
        add_header Content-Type application/javascript;
    }

    location / {
        proxy_pass http://sandpack-bundler:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
