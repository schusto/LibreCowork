# playwright-mcp reverse proxy
#
# playwright-mcp rejects HTTP requests whose Host header is not "localhost:<port>".
# This server block sits in front of the playwright-mcp container, rewrites the
# Host header so the check passes, and disables response buffering so the
# streamable-http POST responses stream back to LibreCowork without delay.
#
# Client → port 8933 on cowork-proxy → playwright-mcp:8931 (container name on
# cowork_default network) with Host: localhost:8931.

server {
    listen 8933;

    location / {
        proxy_pass         http://playwright-mcp:8931;
        proxy_set_header   Host "localhost:8931";
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Disable buffering — required for streamable-http streaming responses.
        proxy_buffering    off;
        proxy_cache        off;

        # Allow long-lived MCP sessions.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
