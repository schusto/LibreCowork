# TLS termination + reverse proxy for LibreCowork.
# Listens on 443 (HTTPS) and proxies to the LibreCowork container on port 3080.
# Also serves port 80 and redirects to HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/cowork.schumann.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cowork.schumann.se/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Large uploads (files sent to the API)
    client_max_body_size 100m;

    location / {
        proxy_pass http://librecowork:3080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE streams (streaming LLM responses) must not be buffered
        proxy_buffering off;
        proxy_cache     off;

        # WebSocket / SSE upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-running LLM requests can take many minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
