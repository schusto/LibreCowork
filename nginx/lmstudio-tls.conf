# HTTPS proxy for LM Studio's local server (port 1234 on the host).
# Uses Let's Encrypt cert for cowork.schumann.se (trusted by all browsers),
# so WebViews that block plain-HTTP loads (e.g. Office add-in task panes)
# can reach LM Studio directly.

server {
    listen 8447 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/cowork.schumann.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cowork.schumann.se/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        # LM Studio's server sends no CORS headers at all, so a browser-based
        # client (e.g. an Office add-in task pane) has its fetch() blocked
        # outright — curl never enforces CORS, which is why this looks fine
        # from the command line. Add it here instead of relying on LM
        # Studio's own "Enable CORS" setting.
        # Reflect whatever headers the client actually requested (the openai
        # SDK adds x-stainless-* telemetry headers a hardcoded allowlist would
        # miss, causing the preflight to fail and the browser to block the
        # real request before it ever reaches the network) — same approach
        # LibreCowork's own CORS middleware uses.
        add_header Access-Control-Allow-Origin  *              always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://host.docker.internal:1234;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE streams (streaming LLM responses) must not be buffered
        proxy_buffering off;
        proxy_cache     off;

        proxy_http_version 1.1;

        # Long-running local inference — same headroom as librecowork.conf.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
