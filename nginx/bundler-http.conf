# Plain HTTP proxy for sandpack-bundler.
# Intercepts /p/preview-protocol.js to serve a patched version that trusts
# private-network origins (192.168.x, 10.x, 172.x, localhost) in addition to
# the hardcoded codesandbox.io list — needed so postMessage handshakes work
# when LibreCowork is served from a private IP rather than codesandbox.io.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8084;
    server_name _;

    # Serve patched preview-protocol.js
    location = /p/preview-protocol.js {
        alias /etc/nginx/csb-static/preview-protocol.js;
        add_header Content-Type application/javascript;
        add_header Access-Control-Allow-Origin *;
    }

    location = /p/chrome-devtool/protocol/index.js {
        alias /etc/nginx/csb-static/chrome-devtool-protocol.js;
        add_header Content-Type application/javascript;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        proxy_pass http://sandpack-bundler:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Prevent gzip so sub_filter can rewrite text
        proxy_set_header Accept-Encoding   "";

        # Rewrite codesandbox.io/p/ URLs in bundler JS to point here instead
        sub_filter 'https://codesandbox.io/p/' 'http://$host:8084/p/';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript text/html;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
